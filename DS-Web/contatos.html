<!DOCTYPE html>
<html>
<head>
    <title>Contatos - Sucos Naturais</title>
    <style>
       
        .navbar {
    background-color: orange;
    overflow: hidden;
    text-align: center;
}

.dropdown {
    display: inline-block;
    overflow: hidden;
}

.dropdown .dropbtn {
    font-size: 16px;    
    border: none;
    outline: none;
    color: white;
    padding: 14px 20px;
    background-color: inherit;
    font-family: inherit;
    margin: 0;
    cursor: pointer;
}

.navbar a:hover, .dropdown:hover .dropbtn {
    background-color: darkorange; /
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
}

.dropdown-content a {
    float: none;
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    text-align: left;
}

.dropdown-content a:hover {
    background-color: #ddd;
}

.dropdown:hover .dropdown-content {
    display: block;
}


.texto-descricao {
    width: 500px;
}


.linha-divisoria {
    width: 50%;
}

        /* Estilo do Formulário */
        .container-contato {
            width: 50%;
            margin: 0 auto;
            text-align: left;
        }

        input[type=text], input[type=email], textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button.btn-enviar {
            background-color: orange;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button.btn-enviar:hover {
            background-color: darkorange;
        }
    </style>
</head>
<body>


    <div class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Menu &#9660;</button>
            <div class="dropdown-content">
                <a href="index.html">Produtos</a>

            </div>
        </div>

        <div class="dropdown">
            <button class="dropbtn">Ajuda &#9660;</button>
            <div class="dropdown-content">
                <a href="contatos.html">Contatos</a>

        <div class="dropdown">
            <button class="dropbtn">Seu &#9660;</button>
            <div class="dropdown-content">
                <a href="carinho.html">Carrinho</a>
                <a href="perfil.html">Perfil</a>
            </div>

    </div>

    <br>

    <center>
        <h1>Fale Conosco</h1>
        <p>Preencha o formulário abaixo ou utilize nossos canais de atendimento.</p>
    </center>

    <br>

    <div class="container-contato">
        <form>
            <label>Seu Nome:</label>
            <input type="text" placeholder="Digite seu nome completo">

            <label>Seu E-mail:</label>
            <input type="email" placeholder="Digite seu e-mail de contato">

            <label>Assunto:</label>
            <input type="text" placeholder="Ex: Dúvidas, Elogios, Sugestões">

            <label>Mensagem:</label>
            <textarea rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>

            <br><br>

            <button type="button" class="btn-enviar" onclick="alert('Mensagem enviada com sucesso!')">Enviar Mensagem</button>
        </form>
    </div>
